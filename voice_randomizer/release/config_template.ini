; 配置说明
; 可双击同目录的“克萝赛MOD设置.exe”进行图形化设置，修改后点击保存。
; 保存后约 1 秒自动重读；ReplacementSet 需要重启游戏。请保留 UTF-16 LE（带 BOM）编码。
; 选项名和值使用下方英文写法，不要翻译。数值只接受整数，越界时限制到注明范围，
; 缺失或无法解析时采用注明默认值。枚举值不区分大小写，无法识别时使用默认值。
;
; Configuration notes
; Open 克萝赛MOD设置.exe in this folder for a graphical editor, then click Save to apply your changes.
; Settings reload about once per second after saving; ReplacementSet requires a restart. Keep UTF-16 LE with BOM.
; Do not translate option names or values. Numeric options accept integers only and are clamped to their stated range;
; missing or invalid values use the stated defaults. Enumerated values are case-insensitive and default if unrecognized.
;
; 所有参与替换的语音共用保底和明光计数，跨剧情/战斗累计，游戏重启后清零。
; 修改 GuaranteeTarget、GuaranteeEnabled 或 CapturingRadianceEnabled 后，全部随机机制计数清零；
; 仅修改软保底开关、阈值或提升幅度时，仅软保底连续未中计数清零，
; 即使当时处于停用或非随机模式也一样。重复读取未变化的配置，以及修改基础概率、UI 或日志设置不会清零。
; 缺少旧资源的语音不参与抽取、不消耗状态；运行中旧文件丢失或排队失败时回退到游戏配音，不重抽或回滚状态。
;
; All eligible voices share guarantee/radiance state across story and battle; restarting the game resets it.
; Changing GuaranteeTarget, GuaranteeEnabled or CapturingRadianceEnabled resets all rule counters;
; changing only soft-pity settings resets only the soft-pity miss count,
; even while disabled or outside random mode. Unchanged reloads and probability, UI or logging changes preserve state.
; Lines without legacy resources do not consume state. Missing files or failed legacy queues fall back without rerolling or undoing state.

[Randomizer]
; 语音替换总开关：1=启用（默认），0=全部播放游戏新版并暂停随机状态。
; UI 有独立开关，不受此设置影响。
;
; Master voice switch: 1=enabled (default), 0=use game/new audio and pause random state.
; The UI has its own switch and is not affected by this setting.
Enabled=1

; 默认语音音量，整数 0-100，默认 100；0=静音，100=原音量。
; 语音替换启用且双声道关闭时，作用于已识别克萝赛语音的新版、旧版及随机/交替结果。
; 双声道开启时忽略此项，使用左右独立音量；数值保留。约 1 秒重读，对后续语音生效。
; Default voice volume: integer 0-100, default 100; 0=mute, 100=unchanged.
; Applies to identified Klose voices in normal modes while replacement is enabled.
; Stereo ignores this value and uses LeftVolume/RightVolume; the saved value is retained.
; Reloads in about one second and applies to subsequently created voices.
VolumePercent=100

; 选择模式，默认 random。random=基础随机并应用下方已启用的保底和捕获明光。
; new=始终新版；old=始终旧版（无可用旧资源则新版）；alternate=同一句按新、旧交替，首次为新。
; new/old/alternate 不抽随机数、不触发两层机制、暂停累计状态；切回 random 后继续。
;
; Selection mode, default random. random=base random draw plus the enabled guarantee/radiance rules below.
; new=always new; old=always legacy (new if unavailable); alternate=per-line new/old alternation, starting with new.
; new/old/alternate skip RNG and both mechanisms, pausing their state until random mode resumes.
Mode=random

; 基础旧版概率，整数 0～100，默认 50；新版基础概率为 100 减此值。
; 无论保底目标是哪版，这个数始终表示旧版概率。两层机制顶替后，最终比例可能不同。
;
; Base OLD probability, integer 0-100, default 50; base NEW probability is 100 minus this value.
; This always means OLD probability regardless of target. Guarantee/radiance overrides can change the final ratio.
OldPercent=50

; 目标版本，new=偏向新版（默认），old=偏向旧版；同时决定保底和捕获明光的结果。
; 改为 old 时规则镜像反转：随机新版算“歪”，下次保底旧版，捕获明光也出旧版。
; 【歪】表示普通随机抽到非目标版本；即使两层机制都关闭也按此目标显示。
; 头像对应实际音频版本；普通随机目标结果、强制/交替模式和保底不显示【歪】。修改目标不会改写已有历史。
;
; Preferred version: new=favor new (default), old=favor legacy; controls BOTH guarantee and Capturing Radiance outcomes.
; With old, rules mirror: random NEW is a miss, the next guarantee is OLD, and Capturing Radiance also selects OLD.
; The Wai badge marks an ordinary random result opposite to the target, even when both mechanisms are disabled.
; Avatars match actual audio. Target hits, forced/alternate plays and guarantees have no Wai badge. Existing history is not rewritten.
GuaranteeTarget=new

; 保底开关：1=启用（默认），0=关闭。仅影响 random 模式；可与捕获明光独立开关。
; 普通随机抽到非目标版本后，下次参与替换的播放必定选目标版本，不抽随机数、不改明光计数。
; 保底优先于捕获明光；关闭后不积累待触发保底，但不会停用捕获明光。
;
; Guarantee switch: 1=enabled (default), 0=disabled. Applies only in random mode, independently of Capturing Radiance.
; After an ordinary random miss, the next eligible play selects the target without drawing RNG or changing the radiance count.
; Guarantee takes priority over Capturing Radiance. When disabled, no pending guarantee accumulates; radiance can still work.
GuaranteeEnabled=1

; 捕获明光开关：1=启用（默认），0=关闭。仅影响 random 模式；关闭时计数保持 0。
; 计数初始 0：普通随机非目标结果 +1，普通随机目标结果 -1，最低 0；保底不计数。
; 若一次非保底抽取开始前计数已达 3，本次仍抽随机数，但无论抽到哪版都顶替为目标版本并清零。
; 触发本次不再按普通随机结果加减计数，不占用或产生保底；关闭保底时同样可以独立触发。
; 新版目标示例：旧 → 保底新 → 旧 → 保底新 → 旧 → 保底新 → 明光新。
; 旧版目标示例：新 → 保底旧 → 新 → 保底旧 → 新 → 保底旧 → 明光旧。
;
; Capturing Radiance switch: 1=enabled (default), 0=disabled. Random mode only; its counter stays zero while disabled.
; Counter starts at 0: an ordinary random miss adds 1; a target hit subtracts 1, floored at 0. Guarantees do not count.
; If the count is already 3 before a non-guaranteed draw, draw RNG once, override either result with the target, then reset to 0.
; This override does not also apply ordinary count changes or consume/create a guarantee; it works with guarantee disabled too.
; New-target example: old -> guaranteed new -> old -> guaranteed new -> old -> guaranteed new -> radiance new.
; Old-target example: new -> guaranteed old -> new -> guaranteed old -> new -> guaranteed old -> radiance old.
CapturingRadianceEnabled=1

; 软保底：默认关闭。连续未中目标 SoftPityStart 次后，下一次抽取提升目标概率
; SoftPityStep 个百分点；再未中则下次继续提升相同百分点，最高 100%。
; 命中目标（包括硬保底或捕获明光）后连续未中计数清零。硬保底优先，可能提前清零。
; 仅 random 且未启用双声道时累计；切换非随机模式或启用双声道暂停计数。
; 修改软保底开关、阈值或提升百分点后，仅软保底连续未中计数清零。
;
; Soft pity is off by default. After SoftPityStart consecutive target misses, the next draw
; adds SoftPityStep percentage points to the target chance. Each further miss adds the same
; amount, capped at 100%. A target hit (including Guarantee/Radiance) resets the miss count.
; Guarantee takes priority and may reset it earlier. Non-random modes and stereo pause it.
; Changing the soft-pity switch, threshold or step resets only its consecutive miss count.
SoftPityEnabled=0
; 连续未中阈值 / Consecutive-miss threshold: 1-1000, default 10.
SoftPityStart=10
; 每次提升百分点 / Added percentage points per further draw: 0-100, default 5.
SoftPityStep=5

; 旧版分支素材集，legacy=正式旧版（默认，assets/old）；placeholder=测试占位音（assets/placeholder）。
; 本发布包只提供 legacy；placeholder 仅供保留测试素材的开发目录使用，缺少素材则跳过替换。
; 启动时读取，修改后需要重启游戏；不识别的值使用 legacy。
;
; Legacy-branch asset set: legacy=real legacy audio (default, assets/old); placeholder=test audio (assets/placeholder).
; This release includes only legacy; placeholder is for development installs retaining test assets. Missing assets are skipped.
; Read at startup; restart after changing. Unrecognized values use legacy.
ReplacementSet=legacy

; 缓存详细日志：0=关闭（默认），1=记录缓存命中/未命中，排查问题时使用。
; 关闭后仍记录初始化、配置、播放选择、UI 和错误；不会影响抽取规则。
; 日志位于 voice_randomizer.log，每次启动重建，记录的是播放请求，不保证被快进取消的语音完整播完。
;
; Verbose cache logging: 0=off (default), 1=record cache hits/misses for troubleshooting.
; Initialization, config, selections, UI and errors are still logged when off; this does not change selection rules.
; voice_randomizer.log is recreated each launch and records requests, including lines later cut short by skipping.
LogCache=0

[Overlay]
; 播放记录 UI：1=显示（默认），0=隐藏。独立于语音总开关，隐藏期间仍保留最近 50 条记录。
; 最新记录从底部出现，旧记录向上滚动；尚无记录时不绘制。
;
; History UI: 1=visible (default), 0=hidden. Independent of the voice switch; the latest 50 entries are retained while hidden.
; New entries appear at the bottom and older entries move upward. Nothing is drawn before the first entry.
Enabled=1

; 列表左边距，占游戏画面宽度的百分比；整数 0～90，默认 2。
; 接近右边缘时自动保持在画面内。
;
; Left margin as a percent of game width; integer 0-90, default 2.
; Placement is constrained to remain on-screen.
LeftPercent=2

; 列表垂直中心，占游戏画面高度的百分比；整数 0～100，默认 40；50 表示上下居中。
; 以原十条参考区域定位；记录向上堆叠，超出画面边缘的部分裁剪。
;
; Vertical center as a percent of game height; integer 0-100, default 40; 50 centers it vertically.
; The original ten-row reference region fixes placement. Extra entries extend upward and are clipped at screen edges.
CenterYPercent=40

; UI 区域高度，占游戏画面高度的百分比；整数 10～100，默认 50。
; 沿用十条参考行高决定头像和标识大小；MaxEntries 仅限制数量，不改变大小或间距。
;
; UI region height as a percent of game height; integer 10-100, default 50.
; Size and spacing use the original ten-row reference height. MaxEntries changes only quantity; Wai scales independently.
HeightPercent=50

; 新记录淡入与列表滚动时长，单位毫秒；整数 0～2000，默认 180。
; 0 表示无动画、立即更新。
;
; New-entry fade and list scroll duration in milliseconds; integer 0-2000, default 180.
; 0 means instant updates without animation.
ScrollMs=180

; 显示条数，整数 1-50，默认 10；条数只改变数量，头像、标识大小和间距保持不变；更多记录向上延伸，超屏部分裁剪。
; Visible entries: integer 1-50, default 10. Count changes quantity only; icon size and spacing stay fixed. More entries extend upward and clip at the screen edge.
MaxEntries=10

; 常态透明度，整数 0-100，默认 0：0=完全不透明，100=完全透明（不可见）。
; 同时作用于头像与标识，并与新记录淡入效果相乘；不会删除记录。
; Normal transparency: integer 0-100, default 0. 0=opaque, 100=fully transparent/invisible.
; Applies to avatars and badges, multiplied by entry fade-in; entries remain retained.
TransparencyPercent=0

; 歪图标独立缩放，整数 0-200，默认 100；0=隐藏歪图标。
; 以歪图标自身左上角固定缩放，不移动锚点，不改变头像或捕获明光标识。
; Wai badge scale: integer 0-200 percent, default 100; 0 hides Wai.
; Its own top-left corner stays fixed. Avatars and Capturing Radiance badges are unchanged.
WaiScalePercent=100

; 1=下一条非克萝赛语音时隐藏记录，直到下一条克萝赛语音再显示；0=关闭（默认）。
; 隐藏只影响绘制，不清空历史。
; 1=hides the history on the next non-Klose voice until Klose speaks again; 0=off (default).
; Hiding affects drawing only and does not clear history.
HideOnOtherVoice=0

[Stereo]
; 双声道开关：0=关闭（默认），1=同时播放新旧语音，默认左新版、右旧版。
; 使用游戏原生双声源和现有旧语音，无需额外合成素材。
; 启用时优先于播放模式，随机、交替与所有保底计数暂停；缺少旧资源时使用游戏配音。
; Stereo: 0=off (default), 1=plays both versions, left new/right legacy by default.
; Uses two native sources and the existing legacy voices; no additional audio pack needed.
; Takes priority over playback mode; random, alternation and all pity counters pause.
; Lines without legacy resources use game audio.
Enabled=0
; 左右互换：0=默认（左新右旧），1=反转；仅双声道启用时生效。
; Swap channels: 0=left new/right legacy, 1=reversed; applies only while stereo is enabled.
SwapChannels=0
; 左右声道独立音量，整数 0-100，默认 100；0=静音，100=原音量。
; Independent left/right volume: integer 0-100, default 100; 0=mute, 100=original volume.
LeftVolume=100
RightVolume=100
